<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./final-jeopardy-styles.css">
    <title>Final Jeopardy</title>
  </head>

  <body>
    <!-- Title/Name of the Final Jeopary Page -->
    <welcome class="welcome-container">
      <h1 class="welcome-text">FINAL JEOPARDY</h1>
    </welcome>
    
    <!-- Do not change the script source. Allows import/export to work. -->
    <script src="./scripts/index.js" type="module"></script>

    <!-- Subtitle of the Final Jeopary Page -->
    <subtitle class="player-turn">
      <player-turn class="player-turn-child">PLAYER TURN</player-turn>
    </subtitle>

    <!-- A single Final Category -->
    <finalCategory class="final-category-parent">
      <player-turn class="final-category-child">FINAL CATEGORY</player-turn>
    </finalCategory>

    <!-- A single Final Question -->
    <finalQuestion class="final-question-parent">
      <player-turn class="final-question-child">FINAL QUESTION</player-turn>
    </finalQuestion>

<!-- Two Forms - fields for Bet Amount and Final Answer -->
    <inputPointBetAmount class="InputData">
      <input class="UserInput" placeholder="Point Bet Amount...">
    </inputPointBetAmount>


<inputFinalAnswer class="FinalInput">
      <input class="UserFinalInput" placeholder="Final answer...">
    </inputFinalAnswer>

    <!-- Button for Betting, currently disabled -->
    <divBet class="Bet">
      <!-- <a href="./final-jeopardy.html"> -->
      <button class="betGuessBtn">BET</button>
    </divBet>

    <!-- Footer info for Page -->
    <f1 class="footer-container">
      <footer class="footer-child">FOOTER SITE INFORMATION</footer>
    </f1>
    
    

    <script src="index.js"></script>
  </body>
</html>
